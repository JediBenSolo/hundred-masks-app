name: Build Android app
on:
  push:
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Unpack the game
        run: |
          cat www.zip.0* > www.zip && mkdir -p www && unzip -q www.zip -d www
          # where the app checks for over-the-air updates: this repository's GitHub Pages site
          echo "{\"base\":\"https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/\"}" > www/ota.json
      - name: Install Capacitor
        run: npm install
      - name: Create the Android project
        run: |
          npx cap add android
          # the update plugin pulls androidx.work 2.10+, which needs compile SDK 35 (Capacitor 6 defaults to 34);
          # only the compile SDK moves, the target SDK stays, and AGP 8.2's "untested SDK" warning is silenced
          sed -i -E 's/compileSdkVersion = [0-9]+/compileSdkVersion = 35/' android/variables.gradle
          echo "android.suppressUnsupportedCompileSdk=35" >> android/gradle.properties
          # Google Play Services (also pulled in by the update plugin) needs Android 6.0+
          sed -i -E 's/minSdkVersion = [0-9]+/minSdkVersion = 23/' android/variables.gradle
          grep -nE 'compileSdkVersion|minSdkVersion' android/variables.gradle
      - name: Adaptive app icon (the game logo on the night sky)
        run: |
          mkdir -p assets
          cp icon-foreground.png assets/icon-foreground.png
          cp icon-background.png assets/icon-background.png
          cp icon-1024.png assets/icon-only.png
          npx @capacitor/assets generate --android
      - name: Portrait, resizable for tablets, foldables and split screen
        run: |
          M=android/app/src/main/AndroidManifest.xml
          # portrait on phones; Android 16 lets large screens rotate anyway, and the game re-fits to any window
          # (unfolding a foldable, split screen) without restarting, because the activity handles size changes itself
          sed -i -E 's/<activity( |$)/<activity android:screenOrientation="portrait" android:resizeableActivity="true"\1/' $M
          grep -n 'screenOrientation="portrait"' $M
      - name: Copy the game into the app
        run: npx cap sync android
      - name: Build and sign
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE }}
          KS_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p out
          cd android && chmod +x gradlew
          if [ -n "$KS" ]; then
            # signed with your own key (the ANDROID_KEYSTORE secret), so every future build installs over this one
            ./gradlew --no-daemon assembleRelease bundleRelease
            echo "$KS" | base64 -d > ../release.p12
            BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n1)
            $BT/zipalign -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk ../out/HundredMasks.apk
            $BT/apksigner sign --ks ../release.p12 --ks-type PKCS12 --ks-pass env:KS_PASS --ks-key-alias hundredmasks ../out/HundredMasks.apk
            $BT/apksigner verify ../out/HundredMasks.apk
            cp app/build/outputs/bundle/release/app-release.aab ../out/HundredMasks.aab
            jarsigner -keystore ../release.p12 -storetype PKCS12 -storepass:env KS_PASS ../out/HundredMasks.aab hundredmasks
            rm ../release.p12
          else
            # no key yet: a debug build to try the game (it cannot be updated in place by a later signed build)
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk ../out/HundredMasks-debug.apk
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: HundredMasks-android
          path: out/
