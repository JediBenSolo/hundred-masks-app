name: Publish game update
# the over-the-air update feed for both apps: version.json and the game bundle on GitHub Pages
on:
  push:
  workflow_dispatch:
jobs:
  updates:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - name: Build the update bundle
        run: |
          cat www.zip.0* > www.zip && mkdir -p site tmp && unzip -q www.zip -d tmp
          echo "{\"base\":\"https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/\"}" > tmp/ota.json
          (cd tmp && zip -qr ../site/www.zip .)
          cp version.json site/version.json
          mkdir -p site/voice && cp -r story-voice site/voice/story
          cp tmp/privacy.html site/privacy.html
          touch site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
